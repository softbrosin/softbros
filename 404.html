<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Softbros</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/images/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px;">
    <div style="max-width: 500px;">
        <img src="/images/logo.png" alt="Softbros Logo" style="width: 48px; height: 48px; border-radius: 8px; margin-bottom: 20px;">
        <h1 style="font-size: 48px; font-weight: 700; color: var(--primary-accent); margin-bottom: 8px;">404</h1>
        <h2 style="font-size: 22px; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">Page Not Found</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 15px;">The page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="/" class="btn-primary" style="padding: 10px 24px;">Return Home</a>
            <a href="/billapp/help/" class="btn-secondary" style="padding: 10px 24px;">Help Center</a>
        </div>
    </div>
</body>
</html>
